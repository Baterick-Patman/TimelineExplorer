[package]
name = "timeline_explorer"
version = "0.2.0"
edition = "2021"
description = "Timeline Explorer - multi-timeline comparison tool"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
